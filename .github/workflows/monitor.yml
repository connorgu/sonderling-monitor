name: Sonderling Monitor

# PUBLIC REPO = unlimited free GitHub Actions minutes (GitHub policy).
# PRIMARY:  each run self-dispatches the next immediately after finishing
# BACKUP:   cron every 5 min restarts the chain if it ever breaks
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# One run at a time — queue the next, never cancel a running job
concurrency:
  group: sonderling-monitor
  cancel-in-progress: false

permissions:
  contents: write   # commit seen_items.json
  actions:  write   # self-dispatch next run

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          GOOGLE_ALERTS_RSS:  ${{ secrets.GOOGLE_ALERTS_RSS }}
          POLL_INTERVAL:      "10"
          LOOP_DURATION:      "270"
        run: python sonderling_monitor.py

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run monitor.yml --ref main

      - name: Persist seen items
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git diff --cached --quiet || git commit -m "chore: update seen items [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
