name: Sonderling Monitor (backup)

# BACKUP ONLY — Railway is the primary 24/7 scanner.
# This cron fires ~every 5 min as a fallback in case Railway goes down.
# No self-triggering chain here — avoids burning GitHub Actions minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit seen_items.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          GOOGLE_ALERTS_RSS:  ${{ secrets.GOOGLE_ALERTS_RSS }}
          POLL_INTERVAL:      "15"
          LOOP_DURATION:      "270"
        run: python sonderling_monitor.py

      - name: Persist seen items
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git diff --cached --quiet || git commit -m "chore: update seen items [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
