name: Sonderling Monitor

on:
  schedule:
    # GitHub Actions minimum is every 5 minutes in practice.
    # The script polls internally every 30 s for 4 min per job,
    # giving near-continuous coverage around the clock.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          # Poll every 30 s; loop for 4 min so runs overlap slightly
          POLL_INTERVAL:      "30"
          LOOP_DURATION:      "240"
        run: python sonderling_monitor.py

      - name: Commit updated seen_items.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git diff --cached --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
