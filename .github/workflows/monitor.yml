name: Sonderling Monitor

on:
  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to commit seen_items.json back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          ALERT_SMS_GATEWAY:  ${{ secrets.ALERT_SMS_GATEWAY }}
        run: python sonderling_monitor.py

      - name: Commit updated seen_items.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
